name: World data contracts

on:
  push:
    branches: [main]
    paths:
      - "maps/historical-world-rpg/**"
      - "maps/historical-world-rpg/_shared/tooling/validate_world.py"
      - "maps/historical-world-rpg/_shared/tooling/validate_quest_events.py"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/world/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/geography/**"
      - "maps/historical-world-rpg/age-of-sail-world/tooling/europe_geography.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_world_contract.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_quest_events.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/fixtures/quest_events/**"
      - ".github/workflows/world-contracts.yml"
  pull_request:
    paths:
      - "maps/historical-world-rpg/**"
      - "maps/historical-world-rpg/_shared/tooling/validate_world.py"
      - "maps/historical-world-rpg/_shared/tooling/validate_quest_events.py"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/world/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/geography/**"
      - "maps/historical-world-rpg/age-of-sail-world/tooling/europe_geography.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_world_contract.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_quest_events.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/fixtures/quest_events/**"
      - ".github/workflows/world-contracts.yml"
  workflow_dispatch:

# Keep PR verification and final main checks, but do not rebuild each agent branch
# twice (once for its push and again for pull_request). New PR commits cancel
# only their own obsolete PR checks; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit reusable framework boundary
        run: python3 maps/historical-world-rpg/_shared/tooling/audit_framework_boundary.py
      - name: Validate world cross-references
        run: |
          python maps/historical-world-rpg/_shared/tooling/validate_world.py             maps/historical-world-rpg/age-of-sail-world/scenario/world/world.json
      - name: Validate Europe geography
        run: python3 maps/historical-world-rpg/age-of-sail-world/tooling/europe_geography.py
      - name: Run contract tests
        run: |
          python -m unittest discover \
            -s maps/historical-world-rpg/age-of-sail-world/tests \
            -p 'test_*.py'
