name: Age of Sail retail launch smoke (diagnostic only)

# Manual only: identity/harness edits must not trigger a 17-map build or a player
# retest. Dispatch only for a reviewed, materially justified diagnostic.
# This workflow never grants real-client acceptance or relaxes release gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launch-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WURST_IMAGE: frotty/wurstscript@sha256:ea428badd326df6f16f5d3857f7aadc100dbaacfbdb8fbac026933ab369fbb5a
      MAP_PROJECT: maps/historical-world-rpg/age-of-sail-world
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate canonical sources
        run: |
          set -eu
          python3 maps/historical-world-rpg/_shared/tooling/validate_world.py \
            maps/historical-world-rpg/age-of-sail-world/scenario/world/world.json
          python3 maps/historical-world-rpg/age-of-sail-world/tooling/validate_map_source.py

      - name: Prepare pinned Wurst image
        run: |
          WURST_RUN_IMAGE=$(bash automation/prepare_wurst_image.sh "$WURST_IMAGE")
          echo "WURST_RUN_IMAGE=$WURST_RUN_IMAGE" >> "$GITHUB_ENV"

      - name: Build and inspect diagnostic campaign in pinned Wurst environment
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          artifact_dir="$RUNNER_TEMP/age-of-sail-launch-smoke"
          mkdir -p "$artifact_dir"
          docker run --rm \
            --pull=never \
            --user root \
            -e WURST_IMAGE \
            -e MAP_PROJECT \
            -e SOURCE_REVISION \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -v "$PWD:/source:ro" \
            -v "$artifact_dir:/out" \
            "$WURST_RUN_IMAGE" \
            /bin/sh -lc '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends python3
              cp -a /source /tmp/workspace
              chown -R wurstuser:wurstuser /tmp/workspace
              su -s /bin/sh wurstuser -c "cd /tmp/workspace/$MAP_PROJECT && PATH=/home/wurstuser/.wurst:/usr/local/bin:/usr/bin:/bin ./tooling/package_campaign.sh"
              su -s /bin/sh wurstuser -c "cd /tmp/workspace/$MAP_PROJECT && python3 tooling/stage_launch_smoke.py --source-revision $SOURCE_REVISION --output /tmp/launch-smoke"
              cp -R /tmp/launch-smoke/. /out/
            '
          python3 "$MAP_PROJECT/tooling/stage_launch_smoke.py" \
            --verify-only --source-revision "$SOURCE_REVISION" --output "$artifact_dir"
          (cd "$artifact_dir" && sha256sum --check SHA256SUMS.txt)
          echo "**Diagnostic identity and archive checks passed. Native launch remains FAILED; candidate NOT RUN.** Latest failing client: 3.0.0 build 24268; preceding failure: 3.0.1 build 24342. Filename identity is not a crash repair. No player retest is requested. Official release gates remain unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare exact standalone selector and optional local adapter, never execute Warcraft
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.request
          sys.path.insert(0, 'maps/historical-world-rpg/_shared/tooling')
          from independent_mpq import READER_REVISION, READER_SHA256
          from prepare_native_map_diagnostic import prepare
          root = Path(os.environ['RUNNER_TEMP'])
          reader = root / 'issue-438-reviewed-mpyq.py'
          payload = urllib.request.urlopen(
              f'https://raw.githubusercontent.com/eagleflo/mpyq/{READER_REVISION}/mpyq.py', timeout=60).read()
          if hashlib.sha256(payload).hexdigest() != READER_SHA256:
              raise SystemExit('independent reader pin mismatch')
          reader.write_bytes(payload)
          artifact = root / 'age-of-sail-launch-smoke'
          receipt = artifact / 'launch-smoke.json'
          metadata = json.loads(receipt.read_text())
          prepare(artifact / metadata['installedCampaignPath'], metadata['campaignSha256'],
                  reader, artifact / 'Standalone', 'Maps/AgeOfSailWorld.w3x', receipt)
          print('Independent map hashes verified; native_runner_unavailable; map/campaign native NOT RUN')
          PY

      - name: Upload diagnostic W3N, never a player release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-of-sail-LAUNCH-SMOKE-NOT-RELEASE-${{ github.run_number }}
          path: ${{ runner.temp }}/age-of-sail-launch-smoke/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
