name: Large-world and multi-century stress
on:
  pull_request:
    paths:
      - "maps/historical-world-rpg/_shared/engine/large_world_stress.py"
      - "maps/historical-world-rpg/_shared/engine/full_world_soak.py"
      - "maps/historical-world-rpg/_shared/engine/performance_benchmark.py"
      - "maps/historical-world-rpg/_shared/engine/final_performance_budget.py"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/benchmarks/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/world/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/economy/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/geography/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/maps/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/politics/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/progression/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/characters/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/settlements/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/treasures/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/military-traditions.json"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/campaign-quests.json"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/historical-events.json"
      - "maps/historical-world-rpg/age-of-sail-world/tooling/run_large_world_stress.py"
      - "maps/historical-world-rpg/age-of-sail-world/tooling/run_full_world_soak.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_large_world_stress.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_final_performance_budgets.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_full_world_soak.py"
      - ".github/workflows/large-world-stress.yml"
  push:
    branches: [main]
    paths:
      - "maps/historical-world-rpg/_shared/engine/large_world_stress.py"
      - "maps/historical-world-rpg/_shared/engine/full_world_soak.py"
      - "maps/historical-world-rpg/_shared/engine/performance_benchmark.py"
      - "maps/historical-world-rpg/_shared/engine/final_performance_budget.py"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/benchmarks/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/world/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/economy/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/geography/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/maps/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/politics/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/progression/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/characters/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/settlements/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/treasures/**"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/military-traditions.json"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/campaign-quests.json"
      - "maps/historical-world-rpg/age-of-sail-world/scenario/historical-events.json"
      - "maps/historical-world-rpg/age-of-sail-world/tooling/run_large_world_stress.py"
      - "maps/historical-world-rpg/age-of-sail-world/tooling/run_full_world_soak.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_large_world_stress.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_final_performance_budgets.py"
      - "maps/historical-world-rpg/age-of-sail-world/tests/test_full_world_soak.py"
      - ".github/workflows/large-world-stress.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  bounded-final-budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exercise final-budget fixtures
        working-directory: maps/historical-world-rpg/age-of-sail-world
        run: python3 -m unittest -v tests.test_final_performance_budgets
      - name: Validate development budgets
        run: python3 maps/historical-world-rpg/age-of-sail-world/tooling/check_final_performance_budgets.py --profile development
  maximum-reasonable-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run maximum-reasonable synthetic world
        run: |
          python3 maps/historical-world-rpg/age-of-sail-world/tooling/run_large_world_stress.py \
            --profile maximum_reasonable_world \
            --summary-out maps/historical-world-rpg/age-of-sail-world/_build/stress/maximum-reasonable.json
      - name: Validate extended minimum-target budgets from the same manifest
        run: python3 maps/historical-world-rpg/age-of-sail-world/tooling/check_final_performance_budgets.py --profile minimum_target
      - uses: actions/upload-artifact@v4
        with:
          name: maximum-reasonable-world-summary
          path: maps/historical-world-rpg/age-of-sail-world/_build/stress/maximum-reasonable.json
          if-no-files-found: error
      - name: Run complete authored 1450-1820 campaign
        run: |
          python3 maps/historical-world-rpg/age-of-sail-world/tooling/run_full_world_soak.py \
            --profile complete_multi_century \
            --summary-out maps/historical-world-rpg/age-of-sail-world/_build/stress/full-world-multi-century.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-world-multi-century-summary
          path: maps/historical-world-rpg/age-of-sail-world/_build/stress/full-world-multi-century.json
          if-no-files-found: error
