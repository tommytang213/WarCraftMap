name: Wurst typecheck and execution

on:
  push:
    branches: [main]
    paths:
      - "maps/historical-world-rpg/**"
      - ".github/workflows/wurst-typecheck.yml"
  pull_request:
    paths:
      - "maps/historical-world-rpg/**"
      - ".github/workflows/wurst-typecheck.yml"
  workflow_dispatch:

# Keep PR verification and final main checks, but do not rebuild each agent branch
# twice (once for its push and again for pull_request). New PR commits cancel
# only their own obsolete PR checks; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  age-of-sail-world:
    runs-on: ubuntu-latest
    env:
      WURST_IMAGE: frotty/wurstscript@sha256:ea428badd326df6f16f5d3857f7aadc100dbaacfbdb8fbac026933ab369fbb5a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical map source
        run: python maps/historical-world-rpg/age-of-sail-world/tooling/validate_map_source.py

      - name: Execute complete suite, typecheck, and package fixture and content mutation
        run: |
          docker run --rm \
            --user root \
            -e WURST_IMAGE \
            -e SOURCE_REVISION="$GITHUB_SHA" \
            -v "$PWD:/source:ro" \
            "$WURST_IMAGE" \
            /bin/sh -lc '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends python3
              cp -a /source /tmp/workspace
              chown -R wurstuser:wurstuser /tmp/workspace
              validation_status=0
              su -s /bin/sh wurstuser -c "export PATH=/home/wurstuser/.wurst:/usr/local/bin:/usr/bin:/bin; cd /tmp/workspace/maps/historical-world-rpg/age-of-sail-world && ./tooling/package_release.sh && python3 ../_shared/tooling/validate_framework_fixture.py ../conformance-campaign" || validation_status=$?
              if [ "$validation_status" -ne 0 ]; then
                for execution_log in \
                  /tmp/workspace/maps/historical-world-rpg/age-of-sail-world/_build/wurst-tests/execution.log \
                  /tmp/workspace/maps/historical-world-rpg/conformance-campaign/_build/wurst-tests/execution.log \
                  /tmp/workspace/maps/historical-world-rpg/conformance-campaign/_build/mutation/campaign/_build/wurst-tests/execution.log
                do
                  if [ -f "$execution_log" ]; then
                    cat "$execution_log" || true
                  fi
                done
              fi
              exit "$validation_status"
            '
