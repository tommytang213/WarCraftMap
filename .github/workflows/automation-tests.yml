name: Automation tests

on:
  push:
    branches: [main]
    paths:
      - "automation/**"
      - ".github/workflows/automation-tests.yml"
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/automation-tests.yml"
  workflow_dispatch:

# Keep PR verification and final main checks, but do not rebuild each agent branch
# twice (once for its push and again for pull_request). New PR commits cancel
# only their own obsolete PR checks; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: World data validation
        run: |
          python maps/historical-world-rpg/_shared/tooling/validate_world.py \
            maps/historical-world-rpg/age-of-sail-world/scenario/world/world.json

      - name: Python tests
        run: |
          python -m unittest discover \
            -s maps/historical-world-rpg/age-of-sail-world/tests \
            -p 'test_*.py'
          python -m unittest discover \
            -s automation/tests \
            -p 'test_*.py'

      - name: Shell syntax
        run: |
          bash -n automation/run_agent.sh
          bash -n automation/run_checks.sh
          bash -n automation/install-user-service.sh
          bash -n automation/uninstall-user-service.sh

      - name: Diff whitespace
        run: git diff --check HEAD^ HEAD
