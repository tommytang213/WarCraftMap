name: Age of Sail campaign artifact

on:
  push:
    branches: [main]
    paths:
      - "maps/historical-world-rpg/**"
      - "automation/prepare_wurst_image.sh"
      - ".github/workflows/map-build.yml"
  pull_request:
    paths:
      - "maps/historical-world-rpg/**"
      - "automation/prepare_wurst_image.sh"
      - ".github/workflows/map-build.yml"
  workflow_dispatch:

# Keep PR verification and final main checks, but do not rebuild each agent branch
# twice (once for its push and again for pull_request). New PR commits cancel
# only their own obsolete PR checks; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-age-of-sail-campaign:
    runs-on: ubuntu-24.04
    env:
      WURST_IMAGE: frotty/wurstscript@sha256:ea428badd326df6f16f5d3857f7aadc100dbaacfbdb8fbac026933ab369fbb5a
      MAP_PROJECT: maps/historical-world-rpg/age-of-sail-world
      RELEASE_ARTIFACT: maps/historical-world-rpg/age-of-sail-world/_build/release/AgeOfSailWorld-phase9-rc1.zip
      RELEASE_VERSION_PREFIX: v0.9
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate canonical source and contracts
        run: |
          python3 maps/historical-world-rpg/_shared/tooling/validate_world.py \
            maps/historical-world-rpg/age-of-sail-world/scenario/world/world.json
          python3 maps/historical-world-rpg/age-of-sail-world/tooling/validate_map_source.py
          python3 maps/historical-world-rpg/age-of-sail-world/tooling/requirement_traceability_audit.py --check

      - name: Prepare pinned Wurst image
        run: |
          WURST_RUN_IMAGE=$(bash automation/prepare_wurst_image.sh "$WURST_IMAGE")
          echo "WURST_RUN_IMAGE=$WURST_RUN_IMAGE" >> "$GITHUB_ENV"

      - name: Execute complete Wurst suite and package with pinned compiler
        id: candidate
        run: |
          artifact_dir="$RUNNER_TEMP/age-of-sail-release"
          mkdir -p "$artifact_dir"

          docker run --rm \
            --pull=never \
            --user root \
            -e MAP_PROJECT \
            -e RELEASE_ARTIFACT \
            -e WURST_IMAGE \
            -e SOURCE_REVISION="$GITHUB_SHA" \
            -v "$PWD:/source:ro" \
            -v "$artifact_dir:/out" \
            "$WURST_RUN_IMAGE" \
            /bin/sh -lc '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends python3
              cp -a /source /tmp/workspace
              chown -R wurstuser:wurstuser /tmp/workspace
              candidate_status=0
              su -s /bin/sh wurstuser -c "cd /tmp/workspace/$MAP_PROJECT && PATH=/home/wurstuser/.wurst:/usr/local/bin:/usr/bin:/bin ./tooling/package_release_candidate.sh --source-revision $SOURCE_REVISION" || candidate_status=$?
              mkdir -p /out/diagnostics
              for report in /tmp/workspace/$MAP_PROJECT/_build/release/requirement-traceability.* /tmp/workspace/$MAP_PROJECT/_build/requirement-traceability-source.*; do
                if [ -f "$report" ]; then cp "$report" /out/diagnostics/; fi
              done
              # Exit 3 means the completed build passed validation but the
              # final traceability report blocks publication. Keep diagnostics
              # without producing or uploading any player candidate files.
              if [ "$candidate_status" -eq 3 ]; then
                test -s /out/diagnostics/requirement-traceability.json
                test -s /out/diagnostics/requirement-traceability.md
                test ! -e "/tmp/workspace/$RELEASE_ARTIFACT"
                echo blocked > /out/candidate-status
                exit 0
              fi
              if [ "$candidate_status" -ne 0 ]; then exit "$candidate_status"; fi
              cp "/tmp/workspace/$RELEASE_ARTIFACT" /out/AgeOfSailWorld-phase9-rc1.zip
              cd "/tmp/workspace/$MAP_PROJECT"
              python3 tooling/verify_ci_release_artifact.py \
                "/out/AgeOfSailWorld-phase9-rc1.zip" \
                --source-revision "$SOURCE_REVISION" \
                --evidence "/out/artifact-evidence.json"
              echo ready > /out/candidate-status
            '

          case "$(cat "$artifact_dir/candidate-status")" in
            ready) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            blocked)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Candidate publication blocked by requirement traceability; see the diagnostics artifact."
              echo "**Candidate publication: blocked.** Validation completed, but the final W3N traceability audit contains release blockers. No player candidate was published. See the age-of-sail-requirement-diagnostics artifact for the complete report." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "Invalid candidate publication status" >&2; exit 1 ;;
          esac

      - name: Retain requirement diagnostics even when publication is blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-of-sail-requirement-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/age-of-sail-release/diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Create versioned player files
        if: steps.candidate.outputs.ready == 'true'
        run: |
          artifact_dir="$RUNNER_TEMP/age-of-sail-release"
          canonical_zip="$artifact_dir/AgeOfSailWorld-phase9-rc1.zip"
          short_sha="${GITHUB_SHA::7}"
          build_version="${RELEASE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}-g${short_sha}"
          versioned_zip="$artifact_dir/AgeOfSailWorld-phase9-rc1-${build_version}.zip"
          versioned_campaign="$artifact_dir/AgeOfSailWorldCampaign-${build_version}.w3n"

          python3 - "$canonical_zip" "$versioned_campaign" <<'PY'
          import sys
          import zipfile

          archive_path, output_path = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive_path) as archive:
              payload = archive.read("Campaigns/AgeOfSailWorldCampaign.w3n")
          with open(output_path, "wb") as stream:
              stream.write(payload)
          PY

          mv "$canonical_zip" "$versioned_zip"
          printf '%s\n' "$build_version" > "$artifact_dir/BUILD_VERSION.txt"

      - name: Confirm verified release payload and evidence
        if: steps.candidate.outputs.ready == 'true'
        run: |
          artifact_dir="$RUNNER_TEMP/age-of-sail-release"
          short_sha="${GITHUB_SHA::7}"
          build_version="${RELEASE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}-g${short_sha}"
          test -s "$artifact_dir/AgeOfSailWorld-phase9-rc1-${build_version}.zip"
          test -s "$artifact_dir/AgeOfSailWorldCampaign-${build_version}.w3n"
          test -s "$artifact_dir/artifact-evidence.json"
          test -s "$artifact_dir/BUILD_VERSION.txt"

      - name: Upload Age of Sail campaign
        if: steps.candidate.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-of-sail-world-release-candidate-${{ env.RELEASE_VERSION_PREFIX }}.${{ github.run_number }}
          path: ${{ runner.temp }}/age-of-sail-release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
