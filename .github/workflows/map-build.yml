name: Age of Sail map artifact

on:
  push:
    paths:
      - "maps/historical-world-rpg/**"
      - ".github/workflows/map-build.yml"
  pull_request:
    paths:
      - "maps/historical-world-rpg/**"
      - ".github/workflows/map-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-age-of-sail-map:
    runs-on: ubuntu-24.04
    env:
      WURST_IMAGE: frotty/wurstscript@sha256:ea428badd326df6f16f5d3857f7aadc100dbaacfbdb8fbac026933ab369fbb5a
      MAP_PROJECT: maps/historical-world-rpg/age-of-sail-world
      MAP_ARTIFACT: maps/historical-world-rpg/age-of-sail-world/_build/release/AgeOfSailWorld.w3x
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate canonical source and contracts
        run: |
          python3 maps/historical-world-rpg/_shared/tooling/validate_world.py \
            maps/historical-world-rpg/age-of-sail-world/scenario/world/world.json
          python3 maps/historical-world-rpg/age-of-sail-world/tooling/validate_map_source.py

      - name: Typecheck and package with pinned Wurst image
        run: |
          docker run --rm \
            --user root \
            -v "$PWD:/workspace" \
            -w "/workspace/$MAP_PROJECT" \
            "$WURST_IMAGE" \
            /bin/sh -lc '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends python3
              chown -R wurstuser:wurstuser /workspace/maps/historical-world-rpg/age-of-sail-world
              su -s /bin/sh wurstuser -c "PATH=/home/wurstuser/.wurst:/usr/local/bin:/usr/bin:/bin ./tooling/package_release.sh"
            '

      - name: Confirm packaged map
        run: test -s "$MAP_ARTIFACT"

      - name: Upload Age of Sail map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-of-sail-world-map
          path: ${{ env.MAP_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
